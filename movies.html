<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>影视上新 · jenning.hidns.cc</title>
<meta name="description" content="今日更新、本周首播、高分推荐，数据自动更新">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,#0d1020 0%,#131a2e 55%,#0d1020 100%); color:#e8ecf4;
    min-height:100vh; padding:20px 14px 40px; }
  main { max-width:520px; margin:0 auto; }
  header { text-align:center; margin-bottom:14px; }
  header h1 { font-size:24px; letter-spacing:1px; }
  header p { color:#93a0b8; font-size:13px; margin-top:6px; line-height:1.6; }
  header a { color:#7cc4ff; text-decoration:none; font-size:13px; }
  h2 { font-size:17px; margin:22px 0 10px; display:flex; align-items:center; gap:8px; }
  h2 .sub { font-size:12px; color:#7c8aa5; font-weight:400; }
  .search { display:flex; gap:8px; margin-top:16px; }
  .search input { flex:1; padding:11px 14px; border-radius:12px; border:1px solid #2a3550;
    background:#141b30; color:#e8ecf4; font-size:15px; outline:none; }
  .search button { padding:11px 18px; border-radius:12px; border:none; cursor:pointer;
    background:linear-gradient(135deg,#3b82f6,#8b5cf6); color:#fff; font-size:15px; font-weight:600; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .card { background:#171e33; border:1px solid #26314f; border-radius:14px; overflow:hidden; cursor:pointer; }
  .card img { width:100%; height:130px; object-fit:cover; display:block; background:#0a0e1a; }
  .card .ph { height:130px; display:flex; align-items:center; justify-content:center; font-size:34px; background:#10182c; }
  .card .info { padding:9px 11px 11px; }
  .card .name { font-size:14px; font-weight:600; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card .meta { font-size:12px; color:#93a0b8; margin-top:5px; line-height:1.55; }
  .card .meta .when { color:#ffd479; }
  .card .rate { color:#ffd479; font-size:12px; }
  .list .row { display:flex; gap:11px; background:#171e33; border:1px solid #26314f; border-radius:14px;
    padding:9px; margin-bottom:9px; cursor:pointer; align-items:center; }
  .list .row img { width:52px; height:70px; object-fit:cover; border-radius:8px; background:#0a0e1a; flex:none; }
  .list .row .ph { width:52px; height:70px; border-radius:8px; background:#10182c; display:flex; align-items:center; justify-content:center; font-size:22px; flex:none; }
  .list .row .name { font-size:14px; font-weight:600; line-height:1.35; }
  .list .row .meta { font-size:12px; color:#93a0b8; margin-top:4px; line-height:1.55; }
  .list .row .meta .when { color:#ffd479; }
  .empty { color:#7c8aa5; font-size:13px; padding:12px 2px; }
  /* 详情弹窗 */
  #mask { display:none; position:fixed; inset:0; background:rgba(4,6,12,.78); z-index:50; padding:22px 14px; overflow:auto; }
  #mask.on { display:block; }
  #detail { max-width:460px; margin:0 auto; background:#171e33; border:1px solid #2c3a5e; border-radius:16px; overflow:hidden; }
  #detail img { width:100%; max-height:230px; object-fit:cover; display:block; }
  #detail .body { padding:16px; }
  #detail h3 { font-size:19px; line-height:1.4; }
  #detail .meta { color:#93a0b8; font-size:13px; margin-top:7px; line-height:1.7; }
  #detail .next { margin-top:11px; background:#10182c; border:1px solid #26314f; border-radius:10px; padding:10px 12px; font-size:14px; line-height:1.7; }
  #detail .next b { color:#ffd479; }
  #detail .sum { font-size:13px; color:#c6d2e6; line-height:1.75; margin-top:11px; }
  #detail .close { display:block; width:100%; margin-top:15px; padding:12px; border:none; border-radius:11px;
    background:linear-gradient(135deg,#3b82f6,#8b5cf6); color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  footer { text-align:center; color:#5f6d88; font-size:12px; margin-top:30px; line-height:1.7; }
  footer a { color:#7cc4ff; text-decoration:none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>🎬 影视上新</h1>
    <p>今日更新 · 本周首播 · 高分推荐<br>数据来自 TVmaze 公开库，打开自动刷新，不用谁维护</p>
    <p style="margin-top:8px"><a href="index.html">← 回主页</a></p>
  </header>

  <div class="search">
    <input id="q" type="search" placeholder="搜剧名（英文名更准，如 Breaking Bad）" enterkeyhint="search">
    <button onclick="doSearch()">搜索</button>
  </div>
  <div id="searchBox" style="display:none">
    <h2>🔍 搜索结果</h2>
    <div class="list" id="searchList"></div>
  </div>

  <h2>📺 今日更新 <span class="sub" id="todayDate"></span></h2>
  <div class="list" id="todayList"><div class="empty">正在加载…</div></div>

  <h2>🆕 本周首播上新 <span class="sub">新剧第一集</span></h2>
  <div class="grid" id="premiereGrid"><div class="empty">正在加载…</div></div>

  <h2>⭐ 高分推荐 <span class="sub">近期在播 · 评分 7.8+</span></h2>
  <div class="grid" id="recoGrid"><div class="empty">正在加载…</div></div>

  <footer>数据来源：TVmaze（免费公开影视库）· 以美剧/国际剧为主，国产剧收录少、更新可能慢<br>
  © 2026 Jenning Ko · <a href="index.html">jenning.hidns.cc</a></footer>
</main>

<div id="mask"><div id="detail"></div></div>

<script>
var API = 'https://api.tvmaze.com';
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function chan(show){ return (show.network&&show.network.name) || (show.webChannel&&show.webChannel.name) || ''; }
function daysFromNow(dateStr){
  var t = new Date(); t.setHours(0,0,0,0);
  var d = new Date(dateStr+'T00:00:00');
  return Math.round((d - t)/86400000);
}
function whenText(dateStr){
  var n = daysFromNow(dateStr);
  if(n===0) return '今天';
  if(n===1) return '明天';
  if(n>1) return n+' 天后 · '+dateStr.slice(5);
  return dateStr.slice(5);
}
function getJSON(url){ return fetch(url).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }); }

/* 合并广播+流媒体两个日程表，按剧去重 */
function schedule(dateStr){
  return Promise.all([
    getJSON(API+'/schedule?date='+dateStr).catch(function(){ return []; }),
    getJSON(API+'/schedule/web?date='+dateStr).catch(function(){ return []; })
  ]).then(function(res){
    var seen={}, out=[];
    res[0].concat(res[1]).forEach(function(ep){
      if(!ep.show) return;
      var key = ep.show.id+'-'+ep.season+'-'+ep.number;
      if(seen[key]) return; seen[key]=1; out.push(ep);
    });
    return out;
  });
}

function rowHTML(ep){
  var s=ep.show, img = s.image? '<img src="'+esc(s.image.medium)+'" alt="">' : '<div class="ph">🎬</div>';
  var rate = s.rating&&s.rating.average ? ' · <span class="rate">★ '+s.rating.average+'</span>' : '';
  var tm = ep.airtime ? ' '+esc(ep.airtime) : '';
  return '<div class="row" onclick="openShow('+s.id+')">'+img+
    '<div><div class="name">'+esc(s.name)+'</div>'+
    '<div class="meta"><span class="when">'+esc(whenText(ep.airdate)+tm)+'</span> · 第 '+ep.season+' 季第 '+ep.number+' 集<br>'+
    esc(chan(s))+rate+'</div></div></div>';
}
function cardHTML(show, metaLine){
  var img = show.image? '<img src="'+esc(show.image.medium)+'" alt="">' : '<div class="ph">🎬</div>';
  return '<div class="card" onclick="openShow('+show.id+')">'+img+
    '<div class="info"><div class="name">'+esc(show.name)+'</div><div class="meta">'+metaLine+'</div></div></div>';
}

/* 今日更新 */
var today = fmtDate(new Date());
document.getElementById('todayDate').textContent = today;
schedule(today).then(function(eps){
  eps.sort(function(a,b){ return (a.airtime||'99') < (b.airtime||'99') ? -1 : 1; });
  var box = document.getElementById('todayList');
  if(!eps.length){ box.innerHTML='<div class="empty">今天暂时没查到更新</div>'; return; }
  box.innerHTML = eps.slice(0,30).map(rowHTML).join('');
}).catch(function(){ document.getElementById('todayList').innerHTML='<div class="empty">加载失败，刷新试试</div>'; });

/* 本周首播 + 高分推荐：拉未来 7 天日程 */
(function(){
  var days=[], i, d;
  for(i=0;i<7;i++){ d=new Date(); d.setDate(d.getDate()+i); days.push(fmtDate(d)); }
  Promise.all(days.map(schedule)).then(function(all){
    var prem={}, seenShow={}, reco=[];
    all.forEach(function(eps){
      eps.forEach(function(ep){
        var s=ep.show;
        if(ep.season===1 && ep.number===1 && !prem[s.id]) prem[s.id]=ep;
        if(!seenShow[s.id]){
          seenShow[s.id]=1;
          if(s.rating && s.rating.average>=7.8 && s.status==='Running') reco.push(s);
        }
      });
    });
    var premList = Object.keys(prem).map(function(k){ return prem[k]; })
      .sort(function(a,b){ return a.airdate<b.airdate?-1:1; }).slice(0,10);
    var pg = document.getElementById('premiereGrid');
    pg.innerHTML = premList.length ? premList.map(function(ep){
      var s=ep.show, rate = s.rating&&s.rating.average ? ' · ★ '+s.rating.average : '';
      return cardHTML(s, '<span class="when">'+esc(whenText(ep.airdate))+'首播</span><br>'+esc(chan(s))+rate);
    }).join('') : '<div class="empty">本周暂无新剧首播</div>';
    reco.sort(function(a,b){ return b.rating.average-a.rating.average; });
    var rg = document.getElementById('recoGrid');
    rg.innerHTML = reco.length ? reco.slice(0,10).map(function(s){
      return cardHTML(s, '★ '+s.rating.average+' · '+esc(chan(s))+'<br>'+esc((s.genres||[]).join(' / ')));
    }).join('') : '<div class="empty">暂无</div>';
  }).catch(function(){
    document.getElementById('premiereGrid').innerHTML='<div class="empty">加载失败，刷新试试</div>';
    document.getElementById('recoGrid').innerHTML='<div class="empty">加载失败，刷新试试</div>';
  });
})();

/* 搜索 */
function doSearch(){
  var q = document.getElementById('q').value.trim();
  if(!q) return;
  var box=document.getElementById('searchBox'), list=document.getElementById('searchList');
  box.style.display='block'; list.innerHTML='<div class="empty">正在搜…</div>';
  getJSON(API+'/search/shows?q='+encodeURIComponent(q)).then(function(res){
    if(!res.length){ list.innerHTML='<div class="empty">没搜到，换个英文名试试</div>'; return; }
    list.innerHTML = res.slice(0,12).map(function(r){
      var s=r.show, img = s.image? '<img src="'+esc(s.image.medium)+'" alt="">' : '<div class="ph">🎬</div>';
      var rate = s.rating&&s.rating.average ? ' · ★ '+s.rating.average : '';
      var st = s.status==='Ended' ? '已完结' : '在播';
      return '<div class="row" onclick="openShow('+s.id+')">'+img+
        '<div><div class="name">'+esc(s.name)+'</div>'+
        '<div class="meta">'+esc(s.premiered?s.premiered.slice(0,4):'')+' · '+st+rate+'<br>'+esc((s.genres||[]).join(' / '))+'</div></div></div>';
    }).join('');
  }).catch(function(){ list.innerHTML='<div class="empty">搜索失败，刷新试试</div>'; });
}
document.getElementById('q').addEventListener('keydown', function(e){ if(e.key==='Enter') doSearch(); });

/* 详情 */
function openShow(id){
  var mask=document.getElementById('mask'), box=document.getElementById('detail');
  mask.classList.add('on'); box.innerHTML='<div class="body">正在加载…</div>';
  getJSON(API+'/shows/'+id+'?embed=nextepisode').then(function(s){
    var img = s.image? '<img src="'+esc(s.image.original||s.image.medium)+'" alt="">' : '';
    var rate = s.rating&&s.rating.average ? ' · ★ '+s.rating.average : '';
    var st = s.status==='Ended' ? '已完结' : '在播';
    var sum = s.summary ? s.summary.replace(/<[^>]+>/g,'') : '暂无简介';
    var next='';
    var ne = s._embedded && s._embedded.nextepisode;
    if(ne){
      next = '<div class="next">📅 下一集：第 '+ne.season+' 季第 '+ne.number+' 集<br><b>'+esc(whenText(ne.airdate))+'</b>（'+esc(ne.airdate)+(ne.airtime?' '+esc(ne.airtime):'')+'）</div>';
    } else if(s.status!=='Ended'){
      next = '<div class="next">📅 下一集播出时间暂未公布</div>';
    } else {
      next = '<div class="next">📅 这部剧已完结</div>';
    }
    box.innerHTML = img+'<div class="body"><h3>'+esc(s.name)+'</h3>'+
      '<div class="meta">'+esc(s.premiered?s.premiered.slice(0,4):'')+' · '+st+rate+'<br>'+esc(chan(s))+' · '+esc((s.genres||[]).join(' / '))+'</div>'+
      next+'<div class="sum">'+esc(sum)+'</div>'+
      '<button class="close" onclick="closeDetail()">关闭</button></div>';
  }).catch(function(){ box.innerHTML='<div class="body">加载失败<button class="close" onclick="closeDetail()">关闭</button></div>'; });
}
function closeDetail(){ document.getElementById('mask').classList.remove('on'); }
document.getElementById('mask').addEventListener('click', function(e){ if(e.target===this) closeDetail(); });
</script>
</body>
</html>
