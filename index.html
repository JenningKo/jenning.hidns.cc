<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; padding-bottom:36px; }
  :root { --bg:#07090f; --text:#eef2fa; --text2:#b9c6dc; --muted:#7c8aa5; --muted2:#8b99b5;
    --card:#10182c; --card2:#141b30; --cardD:#121830; --border:#232c47; }
  html[data-theme="light"] { --bg:#f4f6fb; --text:#131a29; --text2:#3d4a63; --muted:#71809a; --muted2:#8494ad;
    --card:#ffffff; --card2:#e8edf6; --cardD:#ffffff; --border:#d5dcea; }
  html[data-theme="light"] #heroShade { background:linear-gradient(180deg, rgba(244,246,251,.18) 0%, rgba(244,246,251,0) 35%, rgba(244,246,251,.88) 82%, #f4f6fb 100%); }
  html[data-theme="light"] #heroInfo h1 { color:#131a29; text-shadow:0 1px 10px rgba(255,255,255,.65); }
  html[data-theme="light"] #heroInfo .meta { color:#3d4a63; text-shadow:0 1px 6px rgba(255,255,255,.7); }
  html[data-theme="light"] #heroInfo .desc { color:#55637c; }
  #themeBtn { position:fixed; top:12px; right:12px; z-index:60; width:38px; height:38px; border-radius:50%;
    border:1px solid rgba(255,255,255,.35); background:rgba(10,14,24,.45); backdrop-filter:blur(6px);
    font-size:17px; cursor:pointer; line-height:1; }
  html[data-theme="light"] #themeBtn { background:rgba(255,255,255,.65); border-color:rgba(0,0,0,.15); }
  /* 顶部英雄区 */
  #hero { position:relative; height:300px; overflow:hidden; background:var(--card2); }
  #heroImg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .8s; }
  #heroImg.on { opacity:.85; }
  #heroShade { position:absolute; inset:0; background:linear-gradient(180deg, rgba(7,9,15,.25) 0%, rgba(7,9,15,0) 35%, rgba(7,9,15,.88) 82%, #07090f 100%); }
  #heroInfo { position:absolute; left:16px; right:16px; bottom:14px; }
  #heroInfo .tag { display:inline-block; font-size:11px; letter-spacing:1px; color:#ffd479;
    border:1px solid rgba(255,212,121,.55); padding:3px 9px; border-radius:999px; margin-bottom:8px; background:rgba(0,0,0,.35); }
  #heroInfo h1 { font-size:25px; line-height:1.25; text-shadow:0 2px 12px rgba(0,0,0,.7); }
  #heroInfo .meta { font-size:12.5px; color:#cfd9ec; margin-top:6px; text-shadow:0 1px 6px rgba(0,0,0,.8); }
  #heroInfo .desc { font-size:12.5px; color:#aeb9cf; margin-top:5px; line-height:1.55;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  #heroDots { position:absolute; right:16px; bottom:16px; display:flex; gap:5px; }
  #heroDots i { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.35); }
  #heroDots i.on { background:#ffd479; width:16px; border-radius:3px; }
  /* 想看 / 已看 标记（存本机浏览器） */
var marks = {}; try{ marks = JSON.parse(localStorage.getItem('marks')||'{}'); }catch(e){ marks = {}; }
function saveMarks(){ try{ localStorage.setItem('marks', JSON.stringify(marks)); }catch(e){} }
function markKey(type, id){ return type+':'+id; }
function refreshMarkTags(){
  document.querySelectorAll('.pcard').forEach(function(el){
    var t = el.getAttribute('data-t'), i = el.getAttribute('data-i'); if(!t) return;
    var pw = el.querySelector('.pw'); if(!pw) return;
    var old = pw.querySelector('.marktag'); if(old) old.remove();
    var mk = marks[markKey(t, i)];
    if(mk){ var sp = document.createElement('span');
      sp.className = 'marktag ' + (mk.state==='want' ? 'want' : 'seen');
      sp.textContent = mk.state==='want' ? '想看' : '已看'; pw.appendChild(sp); }
  });
}
function renderMarks(){
  var box = document.getElementById('marksBox'), row = document.getElementById('marksRow');
  var list = Object.keys(marks).map(function(k){ var m = marks[k]; m._k = k; return m; });
  list.sort(function(a,b){ if(a.state!==b.state) return a.state==='want' ? -1 : 1; return (b.ts||0)-(a.ts||0); });
  if(!list.length){ box.style.display = 'none'; return; }
  box.style.display = '';
  row.innerHTML = list.map(function(m){
    var p = m._k.split(':'), type = p[0], id = p[1];
    var img = m.poster ? '<img loading="lazy" src="'+IMG+esc(m.poster)+'" alt="">' : '<div class="ph">🎬</div>';
    var tag = '<span class="marktag '+(m.state==='want'?'want':'seen')+'">'+(m.state==='want'?'想看':'已看')+'</span>';
    var score = m.score ? '<span class="star">★ '+m.score+'</span> · ' : '';
    return '<div class="pcard" data-t="'+type+'" data-i="'+id+'" onclick="openDetail(\''+type+'\','+id+')">'+
      '<div class="pw">'+img+tag+'</div><div class="name">'+esc(m.title)+'</div>'+
      '<div class="sub">'+score+esc(m.year||'')+'</div></div>';
  }).join('');
}
function renderMarkButtons(type, x){
  var slot = document.getElementById('markSlot'); if(!slot) return;
  var cur = marks[markKey(type, x.id)] && marks[markKey(type, x.id)].state;
  slot.innerHTML = '<div class="markrow">'+
    '<button class="'+(cur==='want'?'on-want':'')+'" onclick="setMark(\''+type+'\','+x.id+',\'want\')">🔖 想看</button>'+
    '<button class="'+(cur==='seen'?'on-seen':'')+'" onclick="setMark(\''+type+'\','+x.id+',\'seen\')">✔ 已看</button></div>';
  slot._item = { title: title(x), poster: x.poster_path||'', year: (dateOf(x)||'').slice(0,4),
    score: x.vote_average ? x.vote_average.toFixed(1) : '' };
}
function setMark(type, id, state){
  var slot = document.getElementById('markSlot'), k = markKey(type, id);
  if(marks[k] && marks[k].state === state){ delete marks[k]; }
  else { var it = (slot && slot._item) || {};
    marks[k] = { state: state, title: it.title||'', poster: it.poster||'', year: it.year||'', score: it.score||'', ts: Date.now() }; }
  saveMarks(); renderMarks(); refreshMarkTags();
  var cur = marks[k] && marks[k].state;
  if(slot){ var btns = slot.querySelectorAll('.markrow button');
    if(btns[0]) btns[0].className = cur==='want' ? 'on-want' : '';
    if(btns[1]) btns[1].className = cur==='seen' ? 'on-seen' : ''; }
}
renderMarks();

</style>

<script>
var KEY = 'd13be644ec5c83ac9ddf8264cd591bbd';
var BASE = 'https://api.themoviedb.org/3';
var IMG = 'https://image.tmdb.org/t/p/w342';
var IMG_BIG = 'https://image.tmdb.org/t/p/w780';
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function get(path){
  var url = BASE + path + (path.indexOf('?')>=0?'&':'?') + 'api_key=' + KEY + '&language=zh-CN';
  return fetch(url).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); });
}
function daysFromNow(dateStr){
  if(!dateStr) return 0;
  var t = new Date(); t.setHours(0,0,0,0);
  return Math.round((new Date(dateStr+'T00:00:00') - t)/86400000);
}
function whenText(dateStr){
  var n = daysFromNow(dateStr);
  if(n===0) return '今天';
  if(n===1) return '明天';
  if(n>1) return '还有 '+n+' 天';
  return dateStr;
}
function title(x){ return x.title || x.name || ''; }
function dateOf(x){ return x.release_date || x.first_air_date || ''; }
function typeOf(x){ return x.media_type==='tv' || x.name ? 'tv' : 'movie'; }

function card(x, badge){
  var img = x.poster_path ? '<img loading="lazy" src="'+IMG+esc(x.poster_path)+'" alt="">' : '<div class="ph">🎬</div>';
  var score = x.vote_average ? '<span class="star">★ '+x.vote_average.toFixed(1)+'</span> · ' : '';
  var yr = dateOf(x) ? dateOf(x).slice(0,4) : '';
  return '<div class="pcard" data-t="'+typeOf(x)+'" data-i="'+x.id+'" onclick="openDetail(\''+typeOf(x)+'\','+x.id+')">'+
    '<div class="pw">'+img+(badge||'')+'</div>'+
    '<div class="name">'+esc(title(x))+'</div>'+
    '<div class="sub">'+score+yr+'</div></div>';
}
function fillRow(id, list, badgeFn){
  var el = document.getElementById(id);
  if(!list || !list.length){ el.innerHTML='<div class="empty">暂时没加载出来，刷新试试</div>'; return; }
  el.innerHTML = list.map(function(x){ return card(x, badgeFn? badgeFn(x):''); }).join('');
  refreshMarkTags();
}

/* 英雄区轮播 */
var heroList=[], heroIdx=0, heroTimer=null;
function showHero(i){
  var x = heroList[i]; if(!x) return;
  heroIdx = i;
  var img = document.getElementById('heroImg');
  img.classList.remove('on');
  setTimeout(function(){ img.src = IMG_BIG + (x.backdrop_path||x.poster_path||''); img.classList.add('on'); }, 180);
  document.getElementById('heroTitle').textContent = title(x);
  document.getElementById('heroTag').textContent = typeOf(x)==='tv' ? '热播剧集' : '热门电影';
  document.getElementById('heroMeta').textContent =
    (x.vote_average? '★ '+x.vote_average.toFixed(1)+' · ':'') + (dateOf(x)||'') + (typeOf(x)==='tv'?' · 剧集':' · 电影');
  document.getElementById('heroDesc').textContent = x.overview || '';
  document.getElementById('heroDots').innerHTML = heroList.map(function(_,j){
    return '<i class="'+(j===i?'on':'')+'"></i>'; }).join('');
  document.getElementById('hero').onclick = function(){ openDetail(typeOf(x), x.id); };
}
function startHero(list){
  heroList = list.filter(function(x){ return x.backdrop_path; }).slice(0,5);
  if(!heroList.length) return;
  showHero(0);
  clearInterval(heroTimer);
  heroTimer = setInterval(function(){ showHero((heroIdx+1)%heroList.length); }, 6000);
}

/* 各板块 */
get('/trending/all/day').then(function(r){
  var list = (r.results||[]).filter(function(x){ return x.media_type!=='person'; });
  startHero(list);
  fillRow('rowTrend', list.slice(0,14));
}).catch(function(){ fillRow('rowTrend', []); document.getElementById('heroTitle').textContent='加载失败，刷新试试'; });

get('/discover/tv?with_original_language=zh&sort_by=popularity.desc').then(function(r){
  fillRow('rowCN', (r.results||[]).slice(0,14));
}).catch(function(){ fillRow('rowCN', []); });

get('/discover/tv?with_original_language=zh&with_genres=10764,10767&sort_by=popularity.desc').then(function(r){
  var list = (r.results||[]).slice(0,14);
  if(list.length >= 6){ fillRow('rowVariety', list); return; }
  get('/discover/tv?with_genres=10764,10767&sort_by=popularity.desc').then(function(r2){
    var seen = {}; var merged = [];
    list.concat((r2.results||[])).forEach(function(x){ if(!seen[x.id]){ seen[x.id]=1; merged.push(x); } });
    fillRow('rowVariety', merged.slice(0,14));
  }).catch(function(){ fillRow('rowVariety', list); });
}).catch(function(){ fillRow('rowVariety', []); });

/* 黑白主题：默认跟随系统，点按钮手动切换并记住 */
(function(){
  var saved = null; try{ saved = localStorage.getItem('theme'); }catch(e){}
  var mq = window.matchMedia('(prefers-color-scheme: light)');
  var cur = saved || (mq.matches ? 'light' : 'dark');
  function apply(){ document.documentElement.setAttribute('data-theme', cur);
    var b = document.getElementById('themeBtn'); if(b) b.textContent = (cur==='light' ? '☀️' : '🌙'); }
  apply();
  window.toggleTheme = function(){ cur = (cur==='light' ? 'dark' : 'light');
    try{ localStorage.setItem('theme', cur); }catch(e){} apply(); };
  if(mq.addEventListener){ mq.addEventListener('change', function(e){
    var s2 = null; try{ s2 = localStorage.getItem('theme'); }catch(err){}
    if(!s2){ cur = e.matches ? 'light' : 'dark'; apply(); } }); }
})();

get('/tv/airing_today').then(function(r){
  fillRow('rowToday', (r.results||[]).slice(0,14), function(){ return '<span class="badge green">今日更新</span>'; });
}).catch(function(){ fillRow('rowToday', []); });

get('/movie/upcoming?region=CN').then(function(r){
  var today = new Date(); today = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  var list = (r.results||[]).filter(function(x){ return x.release_date && x.release_date >= today; })
    .sort(function(a,b){ return a.release_date<b.release_date?-1:1; }).slice(0,14);
  fillRow('rowSoon', list, function(x){
    return '<span class="badge blue">'+esc(x.release_date.slice(5))+' · '+esc(whenText(x.release_date))+'</span>'; });
}).catch(function(){ fillRow('rowSoon', []); });

get('/movie/top_rated').then(function(r){
  fillRow('rowTop', (r.results||[]).slice(0,14));
}).catch(function(){ fillRow('rowTop', []); });

/* 豆瓣高分经典：固定片单（公认分数）+ TMDB 海报 */
var DOUBAN = [
  ['肖申克的救赎','The Shawshank Redemption',1994,'9.7'],
  ['霸王别姬','Farewell My Concubine',1993,'9.6'],
  ['控方证人','Witness for the Prosecution',1957,'9.6'],
  ['阿甘正传','Forrest Gump',1994,'9.5'],
  ['辛德勒的名单',"Schindler's List",1993,'9.5'],
  ['泰坦尼克号','Titanic',1997,'9.4'],
  ['这个杀手不太冷','Léon: The Professional',1994,'9.4'],
  ['千与千寻','Spirited Away',2001,'9.4'],
  ['星际穿越','Interstellar',2014,'9.4'],
  ['盗梦空间','Inception',2010,'9.4'],
  ['忠犬八公的故事','Hachi: A Dog\'s Tale',2009,'9.4'],
  ['海上钢琴师','The Legend of 1900',1998,'9.3'],
  ['教父','The Godfather',1972,'9.3'],
  ['无间道','Infernal Affairs',2002,'9.3'],
  ['疯狂动物城','Zootopia',2016,'9.2']
];
Promise.all(DOUBAN.map(function(d){
  return get('/search/movie?query='+encodeURIComponent(d[1])+'&year='+d[2]).then(function(r){
    var m = (r.results||[])[0];
    if(!m) return '';
    m = JSON.parse(JSON.stringify(m)); m.title = d[0]; m.media_type='movie';
    return card(m, '<span class="badge">豆瓣 '+d[3]+'</span>');
  }).catch(function(){ return ''; });
})).then(function(htmls){
  var el = document.getElementById('rowDouban');
  el.innerHTML = htmls.join('') || '<div class="empty">暂时没加载出来，刷新试试</div>';
});

/* 搜索 */
function doSearch(){
  var q = document.getElementById('q').value.trim();
  if(!q) return;
  var box=document.getElementById('searchBox'), row=document.getElementById('searchRow');
  box.style.display='block'; row.innerHTML='<div class="empty">正在搜…</div>';
  get('/search/multi?query='+encodeURIComponent(q)).then(function(r){
    var list=(r.results||[]).filter(function(x){ return x.media_type!=='person' && (x.poster_path||x.backdrop_path); }).slice(0,14);
    if(!list.length){ row.innerHTML='<div class="empty">没搜到，换个名字试试</div>'; return; }
    row.innerHTML = list.map(function(x){ return card(x); }).join('');
  }).catch(function(){ row.innerHTML='<div class="empty">搜索失败，刷新试试</div>'; });
}
document.getElementById('q').addEventListener('keydown', function(e){ if(e.key==='Enter') doSearch(); });

/* 详情 */
function openDetail(type, id){
  var mask=document.getElementById('mask'), box=document.getElementById('detail');
  mask.classList.add('on'); box.innerHTML='<div class="body">正在加载…</div>';
  get('/'+type+'/'+id).then(function(x){
    var bd = x.backdrop_path ? '<img class="bd" src="'+IMG_BIG+esc(x.backdrop_path)+'" alt="">' : '';
    var orig = (x.original_title||x.original_name||'');
    var score = x.vote_average ? '<span class="star">★ '+x.vote_average.toFixed(1)+'</span>（TMDB） · ' : '';
    var genres = (x.genres||[]).map(function(g){ return g.name; }).join(' / ');
    var extra='';
    if(type==='tv'){
      var st = x.status==='Ended'||x.status==='Canceled' ? '已完结' : '在播';
      var ne = x.next_episode_to_air;
      if(ne){
        extra = '<div class="next">📅 下一集：第 '+ne.season_number+' 季第 '+ne.episode_number+' 集<br><b>'+esc(whenText(ne.air_date))+'</b>（'+esc(ne.air_date||'')+'）播出</div>';
      } else if(st==='在播'){
        extra = '<div class="next">📅 下一集播出时间暂未公布</div>';
      } else {
        extra = '<div class="next">📅 这部剧已完结，共 '+(x.number_of_seasons||'?')+' 季 '+(x.number_of_episodes||'?')+' 集</div>';
      }
      box.innerHTML = bd+'<div class="body"><h3>'+esc(x.name||'')+'</h3>'+
        (orig&&orig!==x.name?'<div class="orig">'+esc(orig)+'</div>':'')+
        '<div class="meta">'+score+esc(x.first_air_date||'')+' · '+st+'<br>'+esc(genres)+'</div>'+
        extra+'<div class="sum">'+esc(x.overview||'暂无简介')+'</div>'+
        '<div id="markSlot"></div><button class="close" onclick="closeDetail()">关闭</button></div>';
    } else {
      var days = x.release_date ? daysFromNow(x.release_date) : 0;
      extra = '<div class="next">🎬 上映日期：<b>'+esc(x.release_date||'未定')+'</b>'+(days>0?'（'+esc(whenText(x.release_date))+'）':days===0?'（就是今天）':'')+'</div>';
      box.innerHTML = bd+'<div class="body"><h3>'+esc(x.title||'')+'</h3>'+
        (orig&&orig!==x.title?'<div class="orig">'+esc(orig)+'</div>':'')+
        '<div class="meta">'+score+esc(genres)+'</div>'+
        extra+'<div class="sum">'+esc(x.overview||'暂无简介')+'</div>'+
        '<div id="markSlot"></div><button class="close" onclick="closeDetail()">关闭</button></div>';
    }
    renderMarkButtons(type, x);
  }).catch(function(){ box.innerHTML='<div class="body">加载失败<button class="close" onclick="closeDetail()">关闭</button></div>'; });
}
function closeDetail(){ document.getElementById('mask').classList.remove('on'); }
document.getElementById('mask').addEventListener('click', function(e){ if(e.target===this) closeDetail(); });
</script>
